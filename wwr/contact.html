<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riverbound Quest | Contact Us</title>
    <meta name="description"
      content="Contact Riverbound Quest for rafting trip bookings, questions, and adventure planning.">
    <meta name="author" content="Igbaji Prosper Divine">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo-raft.jpg" alt="Rafting Company Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>Riverbound Quest</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@riverbound.com</p>
        </section>
        <section class="contact-content">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6297.657549374974!2d-122.05041825771332!3d37.88768681080473!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808561a2a8ff7a49%3A0x7fc442c1854c45dc!2sAll-Outdoors%20California%20Whitewater%20Rafting!5e0!3m2!1sen!2sng!4v1785528330387!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="contact-form">
                <form>
                    <div class="form-top">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname">

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">

                        <label>Message Purpose</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" id="general" name="purpose" value="general">
                                General Inquiry
                            </label>
                            <label>
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>
                            <label>
                                <input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>
                    <div class="form-bottom">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" rows="5"></textarea>
                        <div class="newsletter-signup">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <label for="newsletter">
                                Please subscribe me to the monthly newsletter
                            </label>
                        </div>

                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </div>
        </section>
        <section class="employees">
            <figure>
                <img src="images/coordinator.jpg" alt="Peter Smith, Trip Coordinator">
                <figcaption>John Smith, Trip Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/guide.jpg" alt="Sarah Johnson, Rafting Guide">
                <figcaption>Sarah Johnson, Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/customer.jpg" alt="Bella Knight, Customer Support">
                <figcaption>Bella Knight, Customer Support</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>© | 2026 | Riverbound Quest | Igbaji Prosper Divine</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
